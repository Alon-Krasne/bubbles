<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>מציירים מילים — Word Painter</title>
<style>
  :root {
    --bg: #FDF8F3;
    --card: #FFFFFF;
    --coral: #FF6B6B;
    --mint: #4ECDC4;
    --sun: #FFE66D;
    --lavender: #A06CD5;
    --sky: #4D96FF;
    --text: #2D3436;
    --outline: #3F3D56;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Rubik', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 15% 15%, #FFEFE6 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, #E6F7F5 0%, transparent 50%),
                var(--bg);
    min-height: 100vh;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text);
    user-select: none;
  }
  header {
    width: 100%;
    max-width: 960px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .nav-btn {
    background: white;
    border: 2px solid #EAD8C7;
    border-radius: 20px;
    padding: 8px 18px;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    box-shadow: 0 4px 0 #EAD8C7;
    cursor: pointer;
  }
  .nav-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #EAD8C7; }
  .lang-toggle {
    display: flex;
    background: white;
    border: 2px solid #EAD8C7;
    border-radius: 20px;
    padding: 3px;
    gap: 4px;
  }
  .lang-opt {
    padding: 6px 14px;
    border-radius: 16px;
    border: none;
    background: none;
    font-weight: 800;
    cursor: pointer;
    font-size: 14px;
    color: #888;
  }
  .lang-opt.active {
    background: var(--coral);
    color: white;
  }
  .main-stage {
    width: 100%;
    max-width: 960px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: stretch;
  }
  @media (max-width: 768px) {
    .main-stage { grid-template-columns: 1fr; }
  }

  /* Word header */
  .word-banner {
    grid-column: 1 / -1;
    background: white;
    border-radius: 24px;
    padding: 14px 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.05), 0 3px 0 #EAD8C7;
    border: 2px solid #F0E4D7;
  }
  .word-banner-title {
    font-size: 15px;
    font-weight: 700;
    color: #999;
    margin-left: 12px;
  }
  .letter-slot {
    width: 52px;
    height: 58px;
    border-radius: 16px;
    background: #F7F3EE;
    border: 3px dashed #D6C7B7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 800;
    color: #C0B0A0;
    transition: all 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .letter-slot.filled {
    background: var(--coral);
    border: 3px solid #E05353;
    color: white;
    box-shadow: 0 6px 0 #C94242;
    transform: scale(1.08);
  }
  .letter-slot.active {
    border-color: var(--mint);
    background: #E8FAF8;
    color: var(--mint);
    animation: pulseSlot 1.5s infinite;
  }
  @keyframes pulseSlot {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(78,205,196,0.4); }
    50% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(78,205,196,0); }
  }

  /* Painting canvas card */
  .art-card {
    background: white;
    border-radius: 28px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 12px 30px rgba(0,0,0,0.06), 0 4px 0 #EAD8C7;
    border: 3px solid #F0E4D7;
    min-height: 420px;
  }
  .art-badge {
    position: absolute;
    top: 16px;
    right: 20px;
    background: #FFF2D6;
    color: #B5841D;
    font-size: 13px;
    font-weight: 800;
    padding: 6px 14px;
    border-radius: 20px;
  }
  .art-canvas-wrap {
    width: 280px;
    height: 280px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .art-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .art-part {
    transition: fill 500ms cubic-bezier(0.34, 1.56, 0.64, 1), transform 400ms ease;
  }
  .art-part.painted {
    animation: splashFill 600ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes splashFill {
    0% { transform: scale(0.92); filter: brightness(1.4); }
    50% { transform: scale(1.06); filter: brightness(1.2); }
    100% { transform: scale(1); filter: brightness(1); }
  }

  /* Tracing slate card */
  .trace-card {
    background: white;
    border-radius: 28px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    box-shadow: 0 12px 30px rgba(0,0,0,0.06), 0 4px 0 #EAD8C7;
    border: 3px solid #F0E4D7;
    min-height: 420px;
  }
  .trace-hint {
    font-size: 16px;
    font-weight: 800;
    color: #555;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .trace-hint span {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #FFF2E0;
    color: #FF9F1C;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 14px;
  }
  .trace-area {
    width: 280px;
    height: 280px;
    background: #FBF9F5;
    border-radius: 24px;
    border: 3px solid #EAD8C7;
    position: relative;
    cursor: crosshair;
    overflow: hidden;
    touch-action: none;
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.03);
  }
  #trace-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
  }
  .guide-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }
  .stroke-guide-bg {
    fill: none;
    stroke: #E4D8CB;
    stroke-width: 32;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .stroke-guide-core {
    fill: none;
    stroke: #FFFFFF;
    stroke-width: 20;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .stroke-arrow-path {
    fill: none;
    stroke: #FF70A6;
    stroke-width: 4;
    stroke-dasharray: 8 8;
    stroke-linecap: round;
    animation: dashMove 1s linear infinite;
  }
  @keyframes dashMove {
    from { stroke-dashoffset: 32; }
    to { stroke-dashoffset: 0; }
  }
  .guide-dot {
    fill: #FF70A6;
    stroke: white;
    stroke-width: 3;
    filter: drop-shadow(0 2px 4px rgba(255,112,166,0.4));
  }
  .guide-number {
    font-size: 15px;
    font-weight: 800;
    fill: white;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }

  /* Completion toast */
  .celebrate-overlay {
    position: fixed;
    inset: 0;
    background: rgba(45,52,54,0.6);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .celebrate-overlay.show { display: flex; animation: fadeIn 300ms ease; }
  .celebrate-box {
    background: white;
    padding: 36px 48px;
    border-radius: 36px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    border: 4px solid var(--sun);
    max-width: 440px;
    animation: popUp 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popUp {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .celebrate-title {
    font-size: 32px;
    font-weight: 800;
    color: var(--coral);
    margin-bottom: 8px;
  }
  .celebrate-sub {
    font-size: 18px;
    color: #666;
    margin-bottom: 24px;
  }
  .celebrate-btn {
    background: var(--mint);
    border: none;
    color: white;
    font-size: 18px;
    font-weight: 800;
    padding: 12px 32px;
    border-radius: 22px;
    cursor: pointer;
    box-shadow: 0 6px 0 #369F97;
  }
  .celebrate-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #369F97; }
</style>
</head>
<body>

<header>
  <a class="nav-btn" href="index.html">← חזרה למשחקים</a>
  <div class="lang-toggle">
    <button class="lang-opt active" id="btn-en" onclick="setLanguage('en')">English (APPLE)</button>
    <button class="lang-opt" id="btn-he" onclick="setLanguage('he')">עברית (תפוח)</button>
  </div>
</header>

<div class="main-stage">
  <!-- Word Slots -->
  <div class="word-banner" id="word-banner">
    <!-- populated dynamically -->
  </div>

  <!-- Left: Coloring Book Canvas -->
  <div class="art-card">
    <div class="art-badge" id="art-badge">שלב צביעה: 0 / 5</div>
    <div class="art-canvas-wrap">
      <svg class="art-svg" viewBox="0 0 280 280">
        <!-- Stem -->
        <path id="part-stem" class="art-part" d="M140 70 C140 45, 155 35, 165 30 C162 38, 152 48, 146 72 Z"
              fill="#F2EBE3" stroke="#3F3D56" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Leaf -->
        <path id="part-leaf" class="art-part" d="M144 58 C165 42, 195 50, 198 68 C180 78, 152 72, 144 58 Z"
              fill="#F2EBE3" stroke="#3F3D56" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Apple Body -->
        <path id="part-body" class="art-part"
              d="M140 85 C115 65, 60 70, 52 120 C42 180, 85 240, 140 245 C195 240, 238 180, 228 120 C220 70, 165 65, 140 85 Z"
              fill="#F2EBE3" stroke="#3F3D56" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Shiny highlight -->
        <path id="part-shine" class="art-part"
              d="M80 110 C75 130, 75 155, 85 175"
              fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="8" stroke-linecap="round"/>
        <!-- Kawaii Face: Eyes & Smile -->
        <g id="part-face">
          <!-- Left Eye -->
          <circle cx="115" cy="155" r="7" fill="#3F3D56"/>
          <circle cx="113" cy="152" r="2.5" fill="white"/>
          <!-- Right Eye -->
          <circle cx="165" cy="155" r="7" fill="#3F3D56"/>
          <circle cx="163" cy="152" r="2.5" fill="white"/>
          <!-- Smile -->
          <path d="M133 166 Q140 174 147 166" fill="none" stroke="#3F3D56" stroke-width="3.5" stroke-linecap="round"/>
          <!-- Cheeks -->
          <ellipse id="part-cheeks" class="art-part" cx="102" cy="165" rx="8" ry="5" fill="transparent"/>
          <ellipse class="art-part cheeks-r" cx="178" cy="165" rx="8" ry="5" fill="transparent"/>
        </g>
      </svg>
    </div>
    <div style="font-size:15px; font-weight:800; color:#888; margin-top:14px;" id="art-caption">
      עקבו אחר החיצים של האות כדי לצבוע את הציור!
    </div>
  </div>

  <!-- Right: Letter Tracing Slate -->
  <div class="trace-card">
    <div class="trace-hint">
      <span>✏️</span>
      <strong id="trace-instruction">עקבו לאורך החץ של האות: A</strong>
    </div>

    <div class="trace-area" id="trace-area">
      <!-- Guide SVG with arrows -->
      <svg class="guide-svg" id="guide-svg" viewBox="0 0 280 280">
        <!-- populated dynamically per letter -->
      </svg>
      <!-- HTML5 Canvas for user drawing stroke -->
      <canvas id="trace-canvas" width="280" height="280"></canvas>
    </div>

    <div style="margin-top: 14px; font-size: 14px; color: #888; font-weight: 600;">
      גררו מאצבע ① לאורך החץ עד לנקודת הסיום ✨
    </div>
  </div>
</div>

<!-- Win Modal -->
<div class="celebrate-overlay" id="celebrate-overlay">
  <div class="celebrate-box">
    <div style="font-size: 64px; margin-bottom: 8px;">🍎🎨</div>
    <div class="celebrate-title">ציור מושלם!</div>
    <div class="celebrate-sub" id="celebrate-word-done">צבעתם את כל התפוח בעזרת האותיות!</div>
    <button class="celebrate-btn" onclick="resetRound()">לצייר שוב ✨</button>
  </div>
</div>

<script>
// --- Audio Context for synthesized kid-friendly musical feedback ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playChime(freq = 440, duration = 0.25) {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function playSuccessFanfare() {
  [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
    setTimeout(() => playChime(f, 0.4), idx * 120);
  });
}

// --- Letter stroke definitions with coordinates & colors ---
// Letters for English (A, P, P, L, E) and Hebrew (ת, פ, ו, ח)
const WORDS = {
  en: {
    word: 'APPLE',
    title: 'Apple',
    letters: [
      {
        char: 'A',
        partToColor: 'body',
        color: '#FF5E62',
        strokes: [
          { from: {x: 140, y: 50}, to: {x: 70, y: 220}, label: '1' },
          { from: {x: 140, y: 50}, to: {x: 210, y: 220}, label: '2' },
          { from: {x: 95, y: 155}, to: {x: 185, y: 155}, label: '3' }
        ]
      },
      {
        char: 'P',
        partToColor: 'leaf',
        color: '#4EBA6F',
        strokes: [
          { from: {x: 90, y: 50}, to: {x: 90, y: 230}, label: '1' },
          { from: {x: 90, y: 50}, to: {x: 190, y: 120}, label: '2' }
        ]
      },
      {
        char: 'P',
        partToColor: 'stem',
        color: '#8D6E63',
        strokes: [
          { from: {x: 90, y: 50}, to: {x: 90, y: 230}, label: '1' },
          { from: {x: 90, y: 50}, to: {x: 190, y: 120}, label: '2' }
        ]
      },
      {
        char: 'L',
        partToColor: 'cheeks',
        color: '#FFAAA6',
        strokes: [
          { from: {x: 90, y: 50}, to: {x: 90, y: 220}, label: '1' },
          { from: {x: 90, y: 220}, to: {x: 200, y: 220}, label: '2' }
        ]
      },
      {
        char: 'E',
        partToColor: 'shine',
        color: '#FFFFFF',
        strokes: [
          { from: {x: 90, y: 50}, to: {x: 90, y: 220}, label: '1' },
          { from: {x: 90, y: 50}, to: {x: 195, y: 50}, label: '2' },
          { from: {x: 90, y: 135}, to: {x: 175, y: 135}, label: '3' },
          { from: {x: 90, y: 220}, to: {x: 195, y: 220}, label: '4' }
        ]
      }
    ]
  },
  he: {
    word: 'תפוח',
    title: 'תפוח',
    letters: [
      {
        char: 'ת',
        partToColor: 'body',
        color: '#FF5E62',
        strokes: [
          { from: {x: 200, y: 60}, to: {x: 75, y: 60}, label: '1' },
          { from: {x: 75, y: 60}, to: {x: 75, y: 220}, label: '2' },
          { from: {x: 200, y: 60}, to: {x: 200, y: 220}, label: '3' }
        ]
      },
      {
        char: 'פ',
        partToColor: 'leaf',
        color: '#4EBA6F',
        strokes: [
          { from: {x: 200, y: 60}, to: {x: 80, y: 60}, label: '1' },
          { from: {x: 80, y: 60}, to: {x: 80, y: 220}, label: '2' },
          { from: {x: 80, y: 220}, to: {x: 200, y: 220}, label: '3' }
        ]
      },
      {
        char: 'ו',
        partToColor: 'stem',
        color: '#8D6E63',
        strokes: [
          { from: {x: 140, y: 50}, to: {x: 140, y: 220}, label: '1' }
        ]
      },
      {
        char: 'ח',
        partToColor: 'cheeks',
        color: '#FFAAA6',
        strokes: [
          { from: {x: 200, y: 60}, to: {x: 80, y: 60}, label: '1' },
          { from: {x: 80, y: 60}, to: {x: 80, y: 220}, label: '2' },
          { from: {x: 200, y: 60}, to: {x: 200, y: 220}, label: '3' }
        ]
      }
    ]
  }
};

let currentLang = 'en';
let currentLetterIdx = 0;
let currentStrokeIdx = 0;
let isDrawing = false;
let userStrokePoints = [];

const canvas = document.getElementById('trace-canvas');
const ctx = canvas.getContext('2d');
const guideSvg = document.getElementById('guide-svg');

function setLanguage(lang) {
  currentLang = lang;
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-he').classList.toggle('active', lang === 'he');
  resetRound();
}

function resetRound() {
  document.getElementById('celebrate-overlay').classList.remove('show');
  currentLetterIdx = 0;
  currentStrokeIdx = 0;

  // Reset SVG parts
  document.getElementById('part-body').setAttribute('fill', '#F2EBE3');
  document.getElementById('part-leaf').setAttribute('fill', '#F2EBE3');
  document.getElementById('part-stem').setAttribute('fill', '#F2EBE3');
  document.getElementById('part-cheeks').setAttribute('fill', 'transparent');
  document.querySelector('.cheeks-r').setAttribute('fill', 'transparent');
  document.querySelectorAll('.art-part').forEach(p => p.classList.remove('painted'));

  renderWordBanner();
  loadCurrentLetter();
}

function renderWordBanner() {
  const data = WORDS[currentLang];
  const banner = document.getElementById('word-banner');
  banner.style.direction = currentLang === 'en' ? 'ltr' : 'rtl';
  banner.innerHTML = `<span class="word-banner-title">${currentLang === 'en' ? 'Word:' : 'המילה:'}</span>`;
  data.letters.forEach((item, idx) => {
    const slot = document.createElement('div');
    slot.className = 'letter-slot';
    slot.id = `slot-${idx}`;
    slot.textContent = idx < currentLetterIdx ? item.char : (idx === currentLetterIdx ? item.char : '?');
    if (idx < currentLetterIdx) slot.classList.add('filled');
    if (idx === currentLetterIdx) slot.classList.add('active');
    banner.appendChild(slot);
  });
}

function loadCurrentLetter() {
  const data = WORDS[currentLang];
  if (currentLetterIdx >= data.letters.length) {
    onWordComplete();
    return;
  }
  currentStrokeIdx = 0;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const letterObj = data.letters[currentLetterIdx];

  document.getElementById('trace-instruction').textContent =
    `עקבו לאורך החץ של האות: ${letterObj.char}`;
  document.getElementById('art-badge').textContent =
    `שלב צביעה: ${currentLetterIdx} / ${data.letters.length}`;

  renderGuideSvg(letterObj);
}

function renderGuideSvg(letterObj) {
  guideSvg.innerHTML = '';

  // 1. Draw static guide background for all strokes of this letter
  letterObj.strokes.forEach((stroke, sIdx) => {
    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    bg.setAttribute('x1', stroke.from.x);
    bg.setAttribute('y1', stroke.from.y);
    bg.setAttribute('x2', stroke.to.x);
    bg.setAttribute('y2', stroke.to.y);
    bg.setAttribute('class', 'stroke-guide-bg');
    guideSvg.appendChild(bg);

    const core = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    core.setAttribute('x1', stroke.from.x);
    core.setAttribute('y1', stroke.from.y);
    core.setAttribute('x2', stroke.to.x);
    core.setAttribute('y2', stroke.to.y);
    core.setAttribute('class', 'stroke-guide-core');
    guideSvg.appendChild(core);
  });

  // 2. Active stroke dashed animated arrow
  const activeStroke = letterObj.strokes[currentStrokeIdx];
  if (activeStroke) {
    const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    arrow.setAttribute('x1', activeStroke.from.x);
    arrow.setAttribute('y1', activeStroke.from.y);
    arrow.setAttribute('x2', activeStroke.to.x);
    arrow.setAttribute('y2', activeStroke.to.y);
    arrow.setAttribute('class', 'stroke-arrow-path');
    guideSvg.appendChild(arrow);

    // Start point circle with number
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', activeStroke.from.x);
    dot.setAttribute('cy', activeStroke.from.y);
    dot.setAttribute('r', '15');
    dot.setAttribute('class', 'guide-dot');
    guideSvg.appendChild(dot);

    const num = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    num.setAttribute('x', activeStroke.from.x);
    num.setAttribute('y', activeStroke.from.y);
    num.setAttribute('class', 'guide-number');
    num.textContent = activeStroke.label;
    guideSvg.appendChild(num);
  }
}

// Canvas Touch/Mouse Tracing
function getPoint(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  return {
    x: (touch.clientX - rect.left) * (canvas.width / rect.width),
    y: (touch.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function dist(p1, p2) {
  return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

function onDown(e) {
  const p = getPoint(e);
  const data = WORDS[currentLang];
  if (currentLetterIdx >= data.letters.length) return;
  const stroke = data.letters[currentLetterIdx].strokes[currentStrokeIdx];

  // Start within 45px of the start dot
  if (dist(p, stroke.from) < 50) {
    isDrawing = true;
    userStrokePoints = [p];
    playChime(320, 0.1);
  }
}

function onMove(e) {
  if (!isDrawing) return;
  const p = getPoint(e);
  userStrokePoints.push(p);

  // Draw smooth glowing line
  ctx.strokeStyle = '#FF6B6B';
  ctx.lineWidth = 18;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(255,107,107,0.5)';
  ctx.shadowBlur = 10;

  if (userStrokePoints.length > 1) {
    const prev = userStrokePoints[userStrokePoints.length - 2];
    ctx.beginPath();
    ctx.moveTo(prev.x, prev.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  // Check if reached destination
  const data = WORDS[currentLang];
  const stroke = data.letters[currentLetterIdx].strokes[currentStrokeIdx];
  if (dist(p, stroke.to) < 45) {
    onStrokeComplete();
  }
}

function onUp() {
  if (!isDrawing) return;
  isDrawing = false;
  // If not completed stroke, fade and retry
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function onStrokeComplete() {
  isDrawing = false;
  playChime(580, 0.2);

  const data = WORDS[currentLang];
  const letterObj = data.letters[currentLetterIdx];
  currentStrokeIdx++;

  if (currentStrokeIdx < letterObj.strokes.length) {
    // Next stroke in this letter
    renderGuideSvg(letterObj);
  } else {
    // Completed full letter!
    onLetterComplete(letterObj);
  }
}

function onLetterComplete(letterObj) {
  playChime(740, 0.35);

  // 1. Paint corresponding part of the apple
  const partEl = document.getElementById(`part-${letterObj.partToColor}`);
  if (partEl) {
    partEl.setAttribute('fill', letterObj.color);
    partEl.classList.add('painted');
    if (letterObj.partToColor === 'cheeks') {
      document.querySelector('.cheeks-r').setAttribute('fill', letterObj.color);
      document.querySelector('.cheeks-r').classList.add('painted');
    }
  }

  // 2. Mark letter slot filled
  const slot = document.getElementById(`slot-${currentLetterIdx}`);
  if (slot) {
    slot.classList.remove('active');
    slot.classList.add('filled');
    slot.textContent = letterObj.char;
  }

  // Advance
  currentLetterIdx++;
  setTimeout(() => {
    renderWordBanner();
    loadCurrentLetter();
  }, 400);
}

function onWordComplete() {
  playSuccessFanfare();
  document.getElementById('art-badge').textContent = `הושלם! ✨`;
  document.getElementById('celebrate-overlay').classList.add('show');
}

// Event Listeners
canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);

canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
window.addEventListener('touchend', onUp);

// Start
setLanguage('en');
</script>
</body>
</html>
